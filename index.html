<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ClawMachine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Fredoka One', cursive;
    background: linear-gradient(135deg, #b8f0f0 0%, #d4f5f5 50%, #e8f8f8 100%);
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  #canvas3d {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }

  .ui-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 15px;
  }

  .ui-layer > * { pointer-events: auto; }

  .title-bar {
    text-align: center;
    font-size: 22px;
    color: #fff;
    text-shadow: 3px 3px 0 #2a9a9f, 0 0 20px rgba(93,224,230,0.6);
    letter-spacing: 2px;
    animation: titleBounce 2s ease-in-out infinite;
  }

  @keyframes titleBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
  }

  .stat-card {
    background: linear-gradient(135deg, rgba(58,184,190,0.9), rgba(42,154,159,0.9));
    border-radius: 15px;
    padding: 8px 18px;
    border: 3px solid rgba(255,255,255,0.4);
    box-shadow: 0 6px 0 rgba(42,154,159,0.6), 0 8px 20px rgba(0,0,0,0.2);
    text-align: center;
    min-width: 90px;
  }

  .stat-label {
    font-size: 10px;
    color: rgba(255,255,255,0.8);
    letter-spacing: 1px;
  }

  .stat-value {
    font-size: 22px;
    color: #ffd700;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    font-family: 'Press Start 2P', monospace;
  }

  .controls-hint {
    text-align: center;
    font-size: 12px;
    color: #fff;
    text-shadow: 2px 2px 0 #2a9a9f;
    background: rgba(42,154,159,0.7);
    padding: 6px 14px;
    border-radius: 20px;
    align-self: center;
    backdrop-filter: blur(4px);
  }

  .mobile-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding-bottom: 10px;
  }

  .m-btn {
    width: 70px; height: 70px;
    background: linear-gradient(180deg, #5de0e6 0%, #3ab8be 100%);
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.5);
    box-shadow: 0 6px 0 #2a9a9f, 0 10px 20px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: #fff;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Fredoka One', cursive;
  }

  .m-btn:active, .m-btn.pressed {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #2a9a9f, 0 2px 6px rgba(0,0,0,0.3);
  }

  .m-btn.drop {
    width: 85px; height: 85px;
    background: linear-gradient(180deg, #ff9ec4 0%, #e07aa0 100%);
    box-shadow: 0 6px 0 #c0608a, 0 10px 20px rgba(0,0,0,0.3);
    font-size: 14px;
  }

  .m-btn.drop:active, .m-btn.drop.pressed {
    box-shadow: 0 1px 0 #c0608a, 0 2px 6px rgba(0,0,0,0.3);
  }

  .bottom-panel {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .action-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 20px;
    border: 3px solid rgba(255,255,255,0.5);
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    transition: transform 0.1s;
    color: #fff;
  }

  .action-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
  .sound-btn { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #333; }
  .bgm-btn { background: linear-gradient(135deg, #c084fc, #9333ea); color: #fff; }
  .reset-btn { background: linear-gradient(135deg, #ff6b6b, #cc4444); }

  .collection-bar {
    background: rgba(42,154,159,0.85);
    border-radius: 15px;
    padding: 8px 12px;
    border: 3px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(6px);
    max-width: 500px;
    margin: 0 auto;
    width: 100%;
  }

  .collection-title {
    font-size: 11px;
    color: #fff;
    text-align: center;
    margin-bottom: 4px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
  }

  .collection-items {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    min-height: 28px;
    font-size: 22px;
  }

  .collection-item {
    animation: popIn 0.4s ease-out;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
  }

  @keyframes popIn {
    0% { transform: scale(0) rotate(-180deg); }
    70% { transform: scale(1.3) rotate(10deg); }
    100% { transform: scale(1) rotate(0); }
  }

  .float-msg {
    position: fixed;
    font-family: 'Fredoka One', cursive;
    font-size: 24px;
    pointer-events: none;
    z-index: 100;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
    animation: floatUp 1.8s ease-out forwards;
    left: 50%;
    top: 40%;
    transform: translateX(-50%);
  }

  @keyframes floatUp {
    0% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.5); }
    20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.2); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-80px) scale(1); }
  }

  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s;
    backdrop-filter: blur(8px);
  }

  .overlay.active { opacity: 1; pointer-events: all; }

  .overlay-box {
    background: linear-gradient(135deg, #5de0e6, #3ab8be);
    border-radius: 25px;
    padding: 35px;
    text-align: center;
    border: 5px solid rgba(255,255,255,0.4);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    transform: scale(0.8);
    transition: transform 0.4s;
    max-width: 380px;
  }

  .overlay.active .overlay-box { transform: scale(1); }

  .overlay-box h2 {
    font-size: 28px;
    color: #fff;
    margin-bottom: 15px;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
  }

  .overlay-box p {
    font-size: 16px;
    color: #fff;
    margin: 6px 0;
  }

  .play-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    padding: 14px 32px;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    border: 4px solid rgba(255,255,255,0.5);
    border-radius: 25px;
    color: #333;
    cursor: pointer;
    margin-top: 20px;
    box-shadow: 0 6px 0 #cc8800;
    transition: transform 0.1s;
  }

  .play-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #cc8800; }

  @media (max-width: 600px) {
    .title-bar { font-size: 16px; }
    .stat-card { min-width: 70px; padding: 6px 10px; }
    .stat-value { font-size: 16px; }
    .m-btn { width: 60px; height: 60px; font-size: 22px; }
    .m-btn.drop { width: 72px; height: 72px; font-size: 12px; }
    .controls-hint { font-size: 10px; }
  }
</style>
</head>
<body>

<canvas id="canvas3d"></canvas>

<div class="ui-layer">
  <div>
    <div class="title-bar"> KAWAII CLAW PARADISE 3D 🌟</div>
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">SCORE</div>
        <div class="stat-value" id="scoreVal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PRIZES</div>
        <div class="stat-value" id="prizesVal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">TRIES</div>
        <div class="stat-value" id="triesVal">10</div>
      </div>
    </div>
  </div>

  <div class="controls-hint">⌨️ ← → or A/D to move · SPACE to drop</div>

  <div>
    <div class="collection-bar">
      <div class="collection-title">🏆 MY COLLECTION</div>
      <div class="collection-items" id="collectionItems">
        <span style="font-size:11px;color:rgba(255,255,255,0.6);">No prizes yet!</span>
      </div>
    </div>

    <div class="mobile-controls" style="margin-top:10px;">
      <div class="m-btn" id="mobLeft">◀</div>
      <div class="m-btn drop" id="mobDrop">DROP</div>
      <div class="m-btn" id="mobRight">▶</div>
    </div>

    <div class="bottom-panel">
      <button class="action-btn sound-btn" id="soundBtn">🔊 ON</button>
      <button class="action-btn bgm-btn" id="bgmBtn">🎵 BGM: OFF</button>
      <button class="action-btn reset-btn" id="resetBtn"> RESET</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="msgTitle">🎮 GAME OVER </h2>
    <p id="msgScore">SCORE: 0</p>
    <p id="msgPrizes">PRIZES: 0</p>
    <button class="play-btn" id="playAgainBtn">PLAY AGAIN</button>
  </div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
(function() {
  'use strict';

  // ============ CONSTANTS ============
  const TOY_TYPES = [
    { name: 'bunny',  emoji: '🐰', color: 0x87CEEB, value: 100, earColor: 0xFFB6C1 },
    { name: 'cat',    emoji: '🐱', color: 0xFFE4B5, value: 150, earColor: 0xFFE4B5 },
    { name: 'bear',   emoji: '🧸', color: 0xD2B48C, value: 200, earColor: 0xD2B48C },
    { name: 'ghost',  emoji: '👻', color: 0xFFB6C1, value: 250, earColor: 0xFFB6C1 },
    { name: 'panda',  emoji: '🐼', color: 0xF0F0F0, value: 300, earColor: 0x333333 },
    { name: 'frog',   emoji: '🐸', color: 0x90EE90, value: 350, earColor: 0x90EE90 },
  ];

  const MAX_ATTEMPTS = 10;
  const CLAW_SPEED = 0.08;
  const DROP_SPEED = 0.06;
  const GRAB_CHANCE = 1.0; // GUARANTEED GRAB!
  const MACHINE_WIDTH = 6;
  const MACHINE_HEIGHT = 5;
  const MACHINE_DEPTH = 4;
  const CLAW_RANGE_X = 2.3;

  // ============ STATE ============
  let state = { score: 0, prizes: 0, attempts: MAX_ATTEMPTS, collection: [], soundOn: true, gameOver: false };
  let clawState = { x: 0, y: 3.5, cableLen: 0.3, mode: 'idle', dir: 0, grabbedToy: null, targetY: 0.2 }; // Even lower!
  let toys = [];
  let particles = [];
  let audioCtx = null;
  let isBgmPlaying = false;
  let bgmTimeout = null;

  // ============ THREE.JS SETUP ============
  const canvas = document.getElementById('canvas3d');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xb8f0f0);
  scene.fog = new THREE.Fog(0xb8f0f0, 15, 30);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 3, 10);
  camera.lookAt(0, 1, 0);

  // ============ LIGHTING ============
  const ambientLight = new THREE.HemisphereLight(0xffffff, 0x88ccff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(5, 10, 7);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 2048;
  dirLight.shadow.mapSize.height = 2048;
  dirLight.shadow.camera.near = 0.5;
  dirLight.shadow.camera.far = 30;
  dirLight.shadow.camera.left = -8;
  dirLight.shadow.camera.right = 8;
  dirLight.shadow.camera.top = 8;
  dirLight.shadow.camera.bottom = -8;
  dirLight.shadow.bias = -0.0005;
  scene.add(dirLight);

  const insideLight = new THREE.PointLight(0x5de0e6, 1.5, 10);
  insideLight.position.set(0, 3, 0);
  scene.add(insideLight);

  const fillLight = new THREE.PointLight(0xff9ec4, 0.5, 8);
  fillLight.position.set(-3, 2, 3);
  scene.add(fillLight);

  // ============ MATERIALS ============
  const matCyan = new THREE.MeshStandardMaterial({ color: 0x5de0e6, roughness: 0.4, metalness: 0.1 });
  const matCyanDark = new THREE.MeshStandardMaterial({ color: 0x3ab8be, roughness: 0.5, metalness: 0.1 });
  const matCyanDarker = new THREE.MeshStandardMaterial({ color: 0x2a9a9f, roughness: 0.6 });
  const matBrown = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.8 });
  const matGlass = new THREE.MeshPhysicalMaterial({
    color: 0xd0f0f5, transparent: true, opacity: 0.25,
    roughness: 0.05, metalness: 0.1, transmission: 0.6,
    thickness: 0.5, clearcoat: 1.0, clearcoatRoughness: 0.1
  });
  const matMetal = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.3, metalness: 0.9 });
  const matMetalDark = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.4, metalness: 0.8 });
  const matFloor = new THREE.MeshStandardMaterial({ color: 0x90d8dc, roughness: 0.7 });

  // ============ BUILD MACHINE ============
  const machineGroup = new THREE.Group();
  scene.add(machineGroup);

  const backPanel = new THREE.Mesh(new THREE.BoxGeometry(MACHINE_WIDTH, MACHINE_HEIGHT, 0.2), matCyanDark);
  backPanel.position.set(0, MACHINE_HEIGHT/2, -MACHINE_DEPTH/2);
  backPanel.castShadow = true; backPanel.receiveShadow = true;
  machineGroup.add(backPanel);

  [-1, 1].forEach(side => {
    const sidePanel = new THREE.Mesh(new THREE.BoxGeometry(0.2, MACHINE_HEIGHT, MACHINE_DEPTH), matCyanDark);
    sidePanel.position.set(side * MACHINE_WIDTH/2, MACHINE_HEIGHT/2, 0);
    sidePanel.castShadow = true; sidePanel.receiveShadow = true;
    machineGroup.add(sidePanel);
  });

  const topPanel = new THREE.Mesh(new THREE.BoxGeometry(MACHINE_WIDTH + 0.4, 0.3, MACHINE_DEPTH + 0.4), matCyan);
  topPanel.position.set(0, MACHINE_HEIGHT, 0);
  topPanel.castShadow = true;
  machineGroup.add(topPanel);

  const topDecor = new THREE.Mesh(new THREE.BoxGeometry(MACHINE_WIDTH + 0.6, 0.4, MACHINE_DEPTH + 0.6), matCyanDarker);
  topDecor.position.set(0, MACHINE_HEIGHT + 0.35, 0);
  machineGroup.add(topDecor);

  const basePanel = new THREE.Mesh(new THREE.BoxGeometry(MACHINE_WIDTH + 0.4, 0.8, MACHINE_DEPTH + 0.4), matCyanDark);
  basePanel.position.set(0, -0.4, 0);
  basePanel.castShadow = true; basePanel.receiveShadow = true;
  machineGroup.add(basePanel);

  const frameThick = 0.25;
  const ft = new THREE.Mesh(new THREE.BoxGeometry(MACHINE_WIDTH + 0.4, frameThick, 0.3), matBrown);
  ft.position.set(0, MACHINE_HEIGHT - 0.1, MACHINE_DEPTH/2 - 0.1);
  machineGroup.add(ft);
  
  const fb = new THREE.Mesh(new THREE.BoxGeometry(MACHINE_WIDTH + 0.4, frameThick, 0.3), matBrown);
  fb.position.set(0, 0.1, MACHINE_DEPTH/2 - 0.1);
  machineGroup.add(fb);
  
  [-1, 1].forEach(side => {
    const fs = new THREE.Mesh(new THREE.BoxGeometry(frameThick, MACHINE_HEIGHT, 0.3), matBrown);
    fs.position.set(side * (MACHINE_WIDTH/2 + 0.1), MACHINE_HEIGHT/2, MACHINE_DEPTH/2 - 0.1);
    machineGroup.add(fs);
  });

  const glassFront = new THREE.Mesh(new THREE.BoxGeometry(MACHINE_WIDTH - 0.1, MACHINE_HEIGHT - 0.4, 0.05), matGlass);
  glassFront.position.set(0, MACHINE_HEIGHT/2, MACHINE_DEPTH/2 - 0.15);
  machineGroup.add(glassFront);

  const glassSideL = new THREE.Mesh(new THREE.BoxGeometry(0.05, MACHINE_HEIGHT - 0.4, MACHINE_DEPTH - 0.3), matGlass);
  glassSideL.position.set(-MACHINE_WIDTH/2 + 0.1, MACHINE_HEIGHT/2, 0);
  machineGroup.add(glassSideL);

  const glassSideR = glassSideL.clone();
  glassSideR.position.x = MACHINE_WIDTH/2 - 0.1;
  machineGroup.add(glassSideR);

  const floor = new THREE.Mesh(new THREE.BoxGeometry(MACHINE_WIDTH - 0.3, 0.1, MACHINE_DEPTH - 0.3), matFloor);
  floor.position.set(0, 0.05, 0);
  floor.receiveShadow = true;
  machineGroup.add(floor);

  for (let i = -2; i <= 2; i++) {
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.11, MACHINE_DEPTH - 0.4), matCyanDarker);
    stripe.position.set(i * 0.6, 0.055, 0);
    machineGroup.add(stripe);
  }

  const rail = new THREE.Mesh(new THREE.BoxGeometry(CLAW_RANGE_X * 2 + 0.5, 0.15, 0.3), matMetalDark);
  rail.position.set(0, MACHINE_HEIGHT - 0.3, 0);
  machineGroup.add(rail);

  const slotBack = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 0.1), matCyanDarker);
  slotBack.position.set(0, 0.4, MACHINE_DEPTH/2 - 0.2);
  machineGroup.add(slotBack);

  [-0.8, 0.8].forEach(x => {
    const stickBase = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.1, 16), matMetalDark);
    stickBase.position.set(x, 0.05, MACHINE_DEPTH/2 + 0.15);
    machineGroup.add(stickBase);
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.3, 12), matMetal);
    stick.position.set(x, 0.25, MACHINE_DEPTH/2 + 0.15);
    machineGroup.add(stick);
    const stickTop = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), matMetalDark);
    stickTop.position.set(x, 0.4, MACHINE_DEPTH/2 + 0.15);
    machineGroup.add(stickTop);
  });

  // ============ BUILD CLAW ============
  const clawGroup = new THREE.Group();
  clawGroup.position.set(0, MACHINE_HEIGHT - 0.3, 0);
  machineGroup.add(clawGroup);

  const carriage = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 0.4), matMetalDark);
  carriage.castShadow = true;
  clawGroup.add(carriage);

  const cableGeom = new THREE.CylinderGeometry(0.03, 0.03, 1, 8);
  const cable = new THREE.Mesh(cableGeom, matMetal);
  cable.position.y = -0.5;
  clawGroup.add(cable);

  const clawHead = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.15, 0.35), matMetal);
  clawHead.position.y = -1;
  clawHead.castShadow = true;
  clawGroup.add(clawHead);

  const prongs = [];
  for (let i = 0; i < 3; i++) {
    const angle = (i / 3) * Math.PI * 2;
    const prong = new THREE.Group();
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.4, 0.06), matMetalDark);
    arm.position.y = -0.2;
    prong.add(arm);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), matMetalDark);
    tip.position.y = -0.4;
    prong.add(tip);
    prong.position.set(Math.cos(angle) * 0.12, -1.15, Math.sin(angle) * 0.12);
    prong.rotation.z = Math.cos(angle) * 0.4;
    prong.rotation.x = Math.sin(angle) * 0.4;
    clawGroup.add(prong);
    prongs.push(prong);
  }

  // ============ BUILD TOYS ============
  function createToy(type, x, z) {
    const group = new THREE.Group();
    const color = type.color;
    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.05 });
    const matDark = new THREE.MeshStandardMaterial({ color: type.earColor || color, roughness: 0.6 });

    const body = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 24), mat);
    body.position.y = 0.35;
    body.castShadow = true;
    group.add(body);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 24), mat);
    head.position.y = 0.75;
    head.castShadow = true;
    group.add(head);

    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const shineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    [-0.1, 0.1].forEach(xOff => {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), eyeMat);
      eye.position.set(xOff, 0.78, 0.28);
      group.add(eye);
      const shine = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 8), shineMat);
      shine.position.set(xOff - 0.015, 0.8, 0.31);
      group.add(shine);
    });

    const blushMat = new THREE.MeshStandardMaterial({ color: 0xff9eb5, roughness: 0.8 });
    [-0.18, 0.18].forEach(xOff => {
      const blush = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), blushMat);
      blush.position.set(xOff, 0.7, 0.27);
      blush.scale.z = 0.5;
      group.add(blush);
    });

    const mouthCurve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(-0.05, 0.68, 0.3),
      new THREE.Vector3(0, 0.65, 0.31),
      new THREE.Vector3(0.05, 0.68, 0.3)
    );
    const mouthGeom = new THREE.TubeGeometry(mouthCurve, 8, 0.015, 6, false);
    const mouth = new THREE.Mesh(mouthGeom, eyeMat);
    group.add(mouth);

    if (type.name === 'bunny') {
      [-0.12, 0.12].forEach(xOff => {
        const ear = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.25, 8, 12), matDark);
        ear.position.set(xOff, 1.1, 0);
        ear.rotation.z = xOff > 0 ? 0.15 : -0.15;
        ear.castShadow = true;
        group.add(ear);
        const inner = new THREE.Mesh(new THREE.CapsuleGeometry(0.03, 0.2, 8, 12), blushMat);
        inner.position.set(xOff, 1.1, 0.04);
        inner.rotation.z = xOff > 0 ? 0.15 : -0.15;
        group.add(inner);
      });
    } else if (type.name === 'cat') {
      [-0.15, 0.15].forEach(xOff => {
        const ear = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.15, 4), matDark);
        ear.position.set(xOff, 1.0, 0);
        ear.rotation.z = xOff > 0 ? 0.2 : -0.2;
        ear.castShadow = true;
        group.add(ear);
      });
    } else if (type.name === 'bear' || type.name === 'panda') {
      [-0.2, 0.2].forEach(xOff => {
        const ear = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), matDark);
        ear.position.set(xOff, 0.95, 0);
        ear.castShadow = true;
        group.add(ear);
      });
      if (type.name === 'panda') {
        [-0.1, 0.1].forEach(xOff => {
          const patch = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), new THREE.MeshStandardMaterial({ color: 0x222222 }));
          patch.position.set(xOff, 0.78, 0.25);
          patch.scale.z = 0.6;
          group.add(patch);
        });
      }
    } else if (type.name === 'frog') {
      [-0.15, 0.15].forEach(xOff => {
        const eyeBump = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), mat);
        eyeBump.position.set(xOff, 0.9, 0.15);
        group.add(eyeBump);
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 10), eyeMat);
        pupil.position.set(xOff, 0.92, 0.24);
        group.add(pupil);
      });
    } else if (type.name === 'ghost') {
      for (let i = 0; i < 5; i++) {
        const wave = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), mat);
        wave.position.set(-0.25 + i * 0.125, 0.1, 0);
        group.add(wave);
      }
    }

    [-0.3, 0.3].forEach(xOff => {
      const arm = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 10), mat);
      arm.position.set(xOff, 0.4, 0.15);
      group.add(arm);
    });

    [-0.15, 0.15].forEach(xOff => {
      const foot = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 10), mat);
      foot.position.set(xOff, 0.1, 0.15);
      foot.scale.y = 0.7;
      group.add(foot);
    });

    group.position.set(x, 0.1, z);
    group.userData = { type, grabbed: false, bobOffset: Math.random() * Math.PI * 2, origY: 0.1 };
    scene.add(group);
    return group;
  }

  function spawnToys() {
    toys.forEach(t => scene.remove(t));
    toys = [];
    const positions = [
      [-1.5, -0.5], [-0.5, -0.8], [0.5, -0.6], [1.5, -0.9],
      [-1.2, 0.3], [-0.3, 0.5], [0.6, 0.2], [1.3, 0.4],
      [-0.8, -1.3], [0.2, -1.2], [1.0, -1.4]
    ];
    positions.forEach(([x, z]) => {
      const type = TOY_TYPES[Math.floor(Math.random() * TOY_TYPES.length)];
      toys.push(createToy(type, x, z));
    });
  }

  // ============ PARTICLES ============
  const particleSprites = [];
  function createParticleTexture(emoji) {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');
    ctx.font = '48px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, 32, 32);
    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  const sparkleTex = createParticleTexture('✨');
  const heartTex = createParticleTexture('💖');
  const starTex = createParticleTexture('⭐');

  function spawnParticles(x, y, z, count, type) {
    const tex = type === 'heart' ? heartTex : type === 'star' ? starTex : sparkleTex;
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
    for (let i = 0; i < count && particleSprites.length < 80; i++) {
      const sprite = new THREE.Sprite(mat.clone());
      sprite.position.set(x, y, z);
      sprite.scale.set(0.3, 0.3, 0.3);
      sprite.userData = {
        vx: (Math.random() - 0.5) * 0.1,
        vy: Math.random() * 0.15 + 0.05,
        vz: (Math.random() - 0.5) * 0.1,
        life: 1,
        decay: 0.015 + Math.random() * 0.01,
        rotSpeed: (Math.random() - 0.5) * 0.1
      };
      scene.add(sprite);
      particleSprites.push(sprite);
    }
  }

  function spawnAmbientParticles() {
    if (Math.random() > 0.05) return;
    const emojis = ['✨', '⭐', '💫'];
    const tex = createParticleTexture(emojis[Math.floor(Math.random() * emojis.length)]);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.5, depthWrite: false });
    const sprite = new THREE.Sprite(mat);
    sprite.position.set(
      (Math.random() - 0.5) * 8,
      Math.random() * 5,
      (Math.random() - 0.5) * 4 + 2
    );
    sprite.scale.set(0.2, 0.2, 0.2);
    sprite.userData = { vy: 0.01 + Math.random() * 0.01, life: 1, decay: 0.005, ambient: true };
    scene.add(sprite);
    particleSprites.push(sprite);
  }

  // ============ AUDIO & BGM ============
  function initAudio() {
    if (!audioCtx) {
      try { 
        audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch(e) {}
    } else if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, duration, type = 'sine', vol = 0.15) {
    if (!state.soundOn || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.start(now);
    osc.stop(now + duration);
  }

  function playSound(type) {
    initAudio();
    if (!state.soundOn || !audioCtx) return;
    switch(type) {
      case 'drop': playTone(400, 0.3, 'sine', 0.12); setTimeout(() => playTone(250, 0.2, 'sine', 0.1), 100); break;
      case 'grab': playTone(523, 0.15, 'square', 0.08); setTimeout(() => playTone(659, 0.15, 'square', 0.08), 100); setTimeout(() => playTone(784, 0.2, 'square', 0.08), 200); break;
      case 'success': [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.2, 'square', 0.08), i * 120)); break;
      case 'miss': playTone(300, 0.4, 'sawtooth', 0.08); setTimeout(() => playTone(200, 0.3, 'sawtooth', 0.08), 150); break;
      case 'gameover': [400, 350, 300, 200].forEach((f, i) => setTimeout(() => playTone(f, 0.3, 'square', 0.1), i * 200)); break;
    }
  }

  function playBgmNote(freq, time, duration, type = 'triangle', vol = 0.04) {
    if (!state.soundOn || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    gain.gain.setValueAtTime(0, time);
    gain.gain.linearRampToValueAtTime(vol, time + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
    
    osc.start(time);
    osc.stop(time + duration);
  }

  function scheduleBgm() {
    if (!isBgmPlaying || !state.soundOn || !audioCtx) return;
    const now = audioCtx.currentTime;
    const tempo = 0.22; 
    
    const melody = [
      { note: 523.25, dur: 1 }, { note: 659.25, dur: 1 }, { note: 783.99, dur: 1 }, { note: 1046.50, dur: 2 },
      { note: 783.99, dur: 1 }, { note: 659.25, dur: 1 }, { note: 523.25, dur: 2 },
      { note: 698.46, dur: 1 }, { note: 880.00, dur: 1 }, { note: 1046.50, dur: 1 }, { note: 1396.91, dur: 2 },
      { note: 880.00, dur: 1 }, { note: 698.46, dur: 1 }, { note: 587.33, dur: 2 },
      { note: 523.25, dur: 1 }, { note: 659.25, dur: 1 }, { note: 783.99, dur: 1 }, { note: 880.00, dur: 1 },
      { note: 783.99, dur: 1 }, { note: 659.25, dur: 1 }, { note: 523.25, dur: 2 },
      { note: 493.88, dur: 1 }, { note: 587.33, dur: 1 }, { note: 659.25, dur: 1 }, { note: 783.99, dur: 1 },
      { note: 523.25, dur: 4 }
    ];

    let currentTime = now + 0.1;
    melody.forEach(m => {
      playBgmNote(m.note, currentTime, m.dur * tempo * 0.9, 'triangle', 0.04);
      if (m.dur >= 2) {
         playBgmNote(m.note / 2, currentTime, m.dur * tempo * 0.9, 'sine', 0.025);
      }
      currentTime += m.dur * tempo;
    });

    const totalDuration = melody.reduce((acc, m) => acc + m.dur * tempo, 0);
    bgmTimeout = setTimeout(scheduleBgm, totalDuration * 1000 - 50);
  }

  function toggleBgm() {
    initAudio();
    if (isBgmPlaying) {
      isBgmPlaying = false;
      clearTimeout(bgmTimeout);
      document.getElementById('bgmBtn').textContent = ' BGM: OFF';
    } else {
      isBgmPlaying = true;
      document.getElementById('bgmBtn').textContent = '🎵 BGM: ON';
      scheduleBgm();
    }
  }

  // ============ GAME LOGIC ============
  function triggerDrop() {
    if (clawState.mode !== 'idle' || state.gameOver || state.attempts <= 0) return;
    clawState.mode = 'dropping';
    clawState.dir = 0;
    clawState.targetY = 0.2; // Even lower for guaranteed grab
    state.attempts--;
    updateStats();
    playSound('drop');
    if (state.attempts <= 3 && state.attempts > 0) showFloatMsg('⚠️ ONLY ' + state.attempts + ' TRIES LEFT!', '#ff6b6b');
  }

  function detectGrab() {
    const clawWorldPos = new THREE.Vector3();
    clawHead.getWorldPosition(clawWorldPos);
    let closest = null, closestDist = Infinity;
    toys.forEach(toy => {
      if (toy.userData.grabbed) return;
      const toyPos = new THREE.Vector3();
      toy.getWorldPosition(toyPos);
      const dist = clawWorldPos.distanceTo(toyPos);
      // MASSIVE grab radius - will grab almost anything!
      if (dist < 2.0 && dist < closestDist) { 
        closestDist = dist; 
        closest = toy; 
      }
    });
    // 100% grab chance when in range
    if (closest && Math.random() < GRAB_CHANCE) return closest;
    return null;
  }

  function grabToy(toy) {
    toy.userData.grabbed = true;
    clawState.grabbedToy = toy;
    clawState.mode = 'returning';
    playSound('grab');
    const pos = new THREE.Vector3();
    toy.getWorldPosition(pos);
    spawnParticles(pos.x, pos.y + 0.5, pos.z, 20, 'sparkle');
    spawnParticles(pos.x, pos.y + 0.5, pos.z, 10, 'heart');
    showFloatMsg('✨ AMAZING! ✨', '#ffd700');
    setTimeout(() => {
      if (clawState.grabbedToy) {
        state.score += clawState.grabbedToy.userData.type.value;
        state.prizes++;
        state.collection.push(clawState.grabbedToy.userData.type);
        updateStats();
        updateCollection();
        saveGame();
        playSound('success');
      }
    }, 600);
  }

  function missGrab() {
    clawState.mode = 'returning';
    playSound('miss');
    showFloatMsg('💭 SO CLOSE!', '#aaa');
  }

  function gameOver() {
    state.gameOver = true;
    playSound('gameover');
    document.getElementById('msgTitle').textContent = '🎮 GAME OVER ';
    document.getElementById('msgScore').textContent = 'SCORE: ' + state.score;
    document.getElementById('msgPrizes').textContent = 'PRIZES: ' + state.prizes;
    document.getElementById('overlay').classList.add('active');
  }

  function playAgain() {
    state.score = 0; state.prizes = 0; state.attempts = MAX_ATTEMPTS;
    state.collection = []; state.gameOver = false;
    clawState.grabbedToy = null; clawState.mode = 'idle'; clawState.dir = 0;
    clawState.x = 0; clawState.cableLen = 0.3;
    spawnToys();
    updateStats(); updateCollection(); saveGame();
    document.getElementById('overlay').classList.remove('active');
  }

  function confirmReset() {
    if (confirm('Reset all progress?')) {
      localStorage.removeItem('kawaiiClaw3DSave');
      playAgain();
    }
  }

  function toggleSound() {
    state.soundOn = !state.soundOn;
    document.getElementById('soundBtn').textContent = state.soundOn ? '🔊 ON' : '🔇 OFF';
  }

  // ============ UI ============
  function updateStats() {
    document.getElementById('scoreVal').textContent = state.score;
    document.getElementById('prizesVal').textContent = state.prizes;
    document.getElementById('triesVal').textContent = state.attempts;
  }

  function updateCollection() {
    const c = document.getElementById('collectionItems');
    if (state.collection.length === 0) {
      c.innerHTML = '<span style="font-size:11px;color:rgba(255,255,255,0.6);">No prizes yet!</span>';
      return;
    }
    c.innerHTML = state.collection.map(t => '<span class="collection-item">' + t.emoji + '</span>').join('');
  }

  function showFloatMsg(text, color) {
    const el = document.createElement('div');
    el.className = 'float-msg';
    el.textContent = text;
    el.style.color = color;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1800);
  }

  function saveGame() {
    try {
      localStorage.setItem('kawaiiClaw3DSave', JSON.stringify({
        score: state.score, prizes: state.prizes, attempts: state.attempts,
        collection: state.collection.map(t => t.name)
      }));
    } catch(e) {}
  }

  function loadGame() {
    try {
      const d = JSON.parse(localStorage.getItem('kawaiiClaw3DSave'));
      if (d) {
        state.score = d.score || 0; state.prizes = d.prizes || 0;
        state.attempts = d.attempts !== undefined ? d.attempts : MAX_ATTEMPTS;
        state.collection = (d.collection || []).map(n => TOY_TYPES.find(t => t.name === n) || TOY_TYPES[0]);
        updateCollection();
      }
    } catch(e) {}
    updateStats();
  }

  // ============ CONTROLS ============
  function setupControls() {
    document.addEventListener('keydown', e => {
      if (state.gameOver) return;
      if (['ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { if (clawState.mode === 'idle') clawState.dir = -1; }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') { if (clawState.mode === 'idle') clawState.dir = 1; }
      if (e.code === 'Space') triggerDrop();
    });
    document.addEventListener('keyup', e => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { if (clawState.dir === -1) clawState.dir = 0; }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') { if (clawState.dir === 1) clawState.dir = 0; }
    });

    setupTouchBtn('mobLeft', 'left');
    setupTouchBtn('mobRight', 'right');
    setupTouchBtn('mobDrop', 'drop');

    document.getElementById('soundBtn').addEventListener('click', toggleSound);
    document.getElementById('bgmBtn').addEventListener('click', toggleBgm);
    document.getElementById('resetBtn').addEventListener('click', confirmReset);
    document.getElementById('playAgainBtn').addEventListener('click', playAgain);
  }

  function setupTouchBtn(id, action) {
    const btn = document.getElementById(id);
    if (!btn) return;
    const start = e => { 
      e.preventDefault(); 
      btn.classList.add('pressed'); 
      if (state.gameOver) return; 
      if (action === 'left' && clawState.mode === 'idle') clawState.dir = -1; 
      if (action === 'right' && clawState.mode === 'idle') clawState.dir = 1; 
      if (action === 'drop') triggerDrop(); 
    };
    const end = e => { 
      e.preventDefault(); 
      btn.classList.remove('pressed'); 
      if (action === 'left' && clawState.dir === -1) clawState.dir = 0; 
      if (action === 'right' && clawState.dir === 1) clawState.dir = 0; 
    };
    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('touchend', end, { passive: false });
    btn.addEventListener('touchcancel', end, { passive: false });
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
  }

  // ============ ANIMATION LOOP ============
  const clock = new THREE.Clock();
  let time = 0;

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    time += dt;

    if (clawState.mode === 'idle' || clawState.mode === 'moving') {
      if (clawState.dir !== 0) {
        clawState.mode = 'moving';
        clawState.x += clawState.dir * CLAW_SPEED;
        clawState.x = Math.max(-CLAW_RANGE_X, Math.min(CLAW_RANGE_X, clawState.x));
      } else {
        clawState.mode = 'idle';
      }
    }

    if (clawState.mode === 'dropping') {
      clawState.cableLen += DROP_SPEED;
      const headY = MACHINE_HEIGHT - 0.3 - clawState.cableLen - 1;
      if (headY <= clawState.targetY) {
        clawState.cableLen = MACHINE_HEIGHT - 0.3 - clawState.targetY - 1;
        const toy = detectGrab();
        if (toy) grabToy(toy); else missGrab();
      }
    }

    if (clawState.mode === 'returning') {
      clawState.cableLen -= DROP_SPEED * 0.7;
      if (clawState.cableLen <= 0.3) {
        clawState.cableLen = 0.3;
        clawState.mode = 'idle';
        clawState.dir = 0;
        if (clawState.grabbedToy) {
          const toy = clawState.grabbedToy;
          scene.remove(toy);
          toys = toys.filter(t => t !== toy);
          clawState.grabbedToy = null;
          setTimeout(() => {
            const type = TOY_TYPES[Math.floor(Math.random() * TOY_TYPES.length)];
            toys.push(createToy(type, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 2 - 0.5));
          }, 800);
        }
        if (state.attempts <= 0 && !state.gameOver) setTimeout(gameOver, 600);
      }
    }

    clawGroup.position.x = clawState.x;
    cable.scale.y = clawState.cableLen;
    cable.position.y = -0.1 - clawState.cableLen / 2;
    clawHead.position.y = -0.15 - clawState.cableLen;
    prongs.forEach((p, i) => {
      const angle = (i / 3) * Math.PI * 2;
      const openAmount = clawState.mode === 'dropping' ? 0.5 : clawState.mode === 'grabbing' || clawState.grabbedToy ? 0.2 : 0.4;
      p.position.set(Math.cos(angle) * 0.12, -0.15 - clawState.cableLen - 0.15, Math.sin(angle) * 0.12);
      p.rotation.z = Math.cos(angle) * openAmount;
      p.rotation.x = Math.sin(angle) * openAmount;
    });

    if (clawState.grabbedToy) {
      const clawPos = new THREE.Vector3();
      clawHead.getWorldPosition(clawPos);
      clawState.grabbedToy.position.x = clawPos.x;
      clawState.grabbedToy.position.y = clawPos.y - 0.4;
      clawState.grabbedToy.position.z = clawPos.z;
      clawState.grabbedToy.rotation.y = time * 2;
    }

    toys.forEach(toy => {
      if (!toy.userData.grabbed) {
        toy.position.y = toy.userData.origY + Math.sin(time * 2 + toy.userData.bobOffset) * 0.03;
        toy.rotation.y = Math.sin(time + toy.userData.bobOffset) * 0.1;
      }
    });

    spawnAmbientParticles();
    for (let i = particleSprites.length - 1; i >= 0; i--) {
      const p = particleSprites[i];
      const d = p.userData;
      p.position.x += d.vx || 0;
      p.position.y += d.vy || 0;
      p.position.z += d.vz || 0;
      if (d.vy !== undefined && !d.ambient) d.vy -= 0.003;
      d.life -= d.decay;
      p.material.opacity = d.life;
      p.scale.multiplyScalar(1.01);
      if (d.rotSpeed) p.material.rotation += d.rotSpeed;
      if (d.life <= 0) {
        scene.remove(p);
        p.material.map.dispose();
        p.material.dispose();
        particleSprites.splice(i, 1);
      }
    }

    camera.position.x = Math.sin(time * 0.3) * 0.1;
    camera.position.y = 3 + Math.sin(time * 0.5) * 0.05;
    camera.lookAt(0, 1.5, 0);

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
  });

  loadGame();
  spawnToys();
  setupControls();
  animate();
})();
</script>
